name: tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  check-emojis:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
        id: install
      - run: pnpm check-emojis --report=emoji-report.md
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('emoji-report.md') != '' }}
        with:
          name: emoji-report
          path: emoji-report.md
          retention-days: 14
      - run: pnpm test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: pnpm build
        if: github.ref == 'refs/heads/main'
      - run: tar -czf emoji-site.tar.gz -C dist .
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: emoji-site
          path: emoji-site.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check-emojis
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: emoji-site
          path: .
      - name: Release main build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "main-${GITHUB_SHA}" >/dev/null 2>&1; then
            gh release upload "main-${GITHUB_SHA}" emoji-site.tar.gz --clobber
          else
            gh release create "main-${GITHUB_SHA}" emoji-site.tar.gz --target "$GITHUB_SHA" --title "Main build ${GITHUB_SHA:0:7}" --prerelease --notes "Validated static site from main."
          fi
