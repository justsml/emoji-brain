<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Emoji delivery sizes</title>
<style>body{font:16px system-ui;background:#151c27;color:#eee;margin:32px;max-width:960px}a{color:#a9c5ff}select,input,button{font:inherit;padding:8px;margin:6px}section{display:flex;gap:28px;flex-wrap:wrap}figure{margin:0}img{display:block;background:repeating-conic-gradient(#aaa 0% 25%,#eee 0% 50%) 0/16px 16px}p{max-width:720px;line-height:1.5}#status{min-height:24px}</style>
<h1>Emoji delivery sizes</h1><p>Optimized WebP at 64×64, 128×128 and 256×256. Transparent padding preserves the original aspect ratio.</p>
<input id="filter" aria-label="Filter emojis" placeholder="Filter names"><select id="name" aria-label="Emoji"></select><p id="status">Loading catalog…</p><section id="images"></section><p><a href="manifest.json">File sizes and source provenance</a></p>
<script type="module">
const manifest=await fetch('manifest.json').then(r=>r.json()),names=Object.keys(manifest.items).sort(),select=document.querySelector('#name'),status=document.querySelector('#status');let generation=0;
function filter(){const query=document.querySelector('#filter').value.toLowerCase();select.replaceChildren(...names.filter(n=>n.includes(query)).map(n=>new Option(n,n)));if(select.value)show();}
async function show(){const id=++generation,n=select.value,r=manifest.items[n];history.replaceState(null,'','#'+encodeURIComponent(n));status.textContent='Loading all sizes…';const figures=await Promise.all([64,128,256].map(async size=>{const v=r.variants[size],f=document.createElement('figure'),im=new Image();im.width=im.height=size;im.alt=n+' '+size+'px';im.src=v.webp.path;await im.decode();const label=document.createElement('p');label.textContent=size+'px · '+(v.webp.bytes/1000).toFixed(1)+' KB';f.append(label,im);for(const [format,asset]of Object.entries({webp:v.webp})){const p=document.createElement('p'),a=document.createElement('a');a.href=asset.path;a.download='';a.textContent='Download WebP';p.append(a);f.append(p);}return f;}));if(id!==generation)return;document.querySelector('#images').replaceChildren(...figures);status.textContent=n+(r.basis==='original-awaiting-review'?' · original retained while the enhancement awaits review':'');document.body.dataset.ready='true';}
select.onchange=show;document.querySelector('#filter').oninput=filter;const initial=decodeURIComponent(location.hash.slice(1));filter();if(names.includes(initial)){select.value=initial;show();}
</script>
